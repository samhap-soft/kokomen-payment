name: CD PROD

on:
  push:
    branches: [ main ]

jobs:
  build-internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start test containers
        run: docker compose -f test-docker-compose.yml up -d

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec payment-test-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Wait for Redis to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec payment-test-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Test & Build
        run: ./gradlew build

      - name: Sign in Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: docker build -f ./Dockerfile --platform linux/arm64 --no-cache -t samhap/kokomen-payment-internal:prod .

      - name: Push the Docker Image to Dockerhub
        run: docker push samhap/kokomen-payment-internal:prod

  deploy-internal:
    needs: build-internal
    runs-on: [ self-hosted, prod, new, payment ]

    steps:
      - name: Stop existing container
        run: sudo docker rm -f kokomen-payment-internal || true

      - name: Remove old INTERNAL Docker image
        run: |
          if sudo docker images samhap/kokomen-payment-internal:prod -q | grep -q .; then
            sudo docker rmi -f samhap/kokomen-payment-internal:prod || true
          fi

      - name: pull docker compose yaml files
        working-directory: /home/ubuntu
        run: |
          [ -d kokomen-payment ] || git clone --filter=blob:none --no-checkout https://github.com/samhap-soft/kokomen-payment.git
          cd kokomen-payment
          git sparse-checkout init --cone
          git fetch origin main
          git checkout main
          git sparse-checkout set docker/prod
          git pull origin main

      - name: Docker Image pull
        run: sudo docker pull samhap/kokomen-payment-internal:prod

      - name: Docker run
        working-directory: /home/ubuntu
        env:
          MYSQL_ROOT_PASSWORD_PROD: ${{ secrets.MYSQL_ROOT_PASSWORD_PROD }}
          SPRING_DATASOURCE_USERNAME_PROD: ${{ secrets.SPRING_DATASOURCE_USERNAME_PROD }}
          SPRING_DATASOURCE_PASSWORD_PROD: ${{ secrets.SPRING_DATASOURCE_PASSWORD_PROD }}
          SPRING_DATASOURCE_URL_PROD: ${{ secrets.SPRING_DATASOURCE_URL_PROD }}
          WIDGET_SECRET_KEY_PROD: ${{ secrets.WIDGET_SECRET_KEY_PROD }}
        run: |
          export HOSTNAME=$(hostname)
          cd kokomen-payment/docker/prod
          sudo -E docker compose -f docker-compose-prod.yml up -d
