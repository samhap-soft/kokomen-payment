name: CI TEST

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start test containers
        run: docker compose -f test-docker-compose.yml up -d

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec payment-test-mysql mysqladmin ping -h localhost --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Wait for Redis to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec payment-test-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Test & Build
        run: ./gradlew build

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() }}
        with:
          files: ${{ github.workspace }}/build/test-results/**/*.xml
          seconds_between_github_reads: 1.0
          seconds_between_github_writes: 3.0
          secondary_rate_limit_wait_seconds: 90.0

      - name: When test fail, comment on that code
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: ${{ github.workspace }}/build/test-results/**/*.xml
          token: ${{ github.token }}
